<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>MyMD</title>
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <div class="topbar-drag" data-tauri-drag-region></div>
        <div class="topbar-row">
          <div class="topbar-start">
            <button id="toggle-sidebar" class="icon-button" type="button" aria-label="Toggle sidebar" aria-controls="sidebar" aria-expanded="false" hidden>
              <svg aria-hidden="true" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2.75" y="3.75" width="14.5" height="12.5" rx="3" />
                <path d="M7.75 3.75v12.5" />
              </svg>
            </button>
            <div class="doc-chip">
              <svg class="doc-glyph" aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4.25 1.75h4.6L12.25 5.1V13a1.25 1.25 0 0 1-1.25 1.25h-6.75A1.25 1.25 0 0 1 3 13V3a1.25 1.25 0 0 1 1.25-1.25Z" />
                <path d="M8.75 1.75V5.25H12.2" />
              </svg>
              <span id="doc-name"></span>
            </div>
            <span id="doc-status" role="status"></span>
          </div>
          <div id="find-slot">
            <label class="find">
              <svg aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
                <circle cx="7" cy="7" r="4.25" />
                <path d="m10.5 10.5 3 3" />
              </svg>
              <input id="find-input" type="text" placeholder="Find in this file" aria-label="Find in this file" aria-keyshortcuts="Control+F" autocomplete="off" spellcheck="false" disabled />
              <span class="find-hint">Ctrl F</span>
              <output id="find-count"></output>
            </label>
          </div>
          <div class="caption-controls">
            <button id="win-minimize" class="caption-button" type="button" aria-label="Minimize">
              <svg aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round">
                <path d="M3.5 8.25h9" />
              </svg>
            </button>
            <button id="win-maximize" class="caption-button" type="button" aria-label="Maximize">
              <svg class="maximize" aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25">
                <rect x="3.25" y="3.25" width="9.5" height="9.5" rx="1.25" />
              </svg>
              <svg class="restore" aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25">
                <rect x="5.25" y="3.25" width="7.5" height="7.5" rx="1.25" />
                <path d="M5.25 6.25H4a.75.75 0 0 0-.75.75V12c0 .41.34.75.75.75h5c.41 0 .75-.34.75-.75V10.75" />
              </svg>
            </button>
            <button id="win-close" class="caption-button" type="button" aria-label="Close">
              <svg aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round">
                <path d="M4.25 4.25l7.5 7.5M11.75 4.25l-7.5 7.5" />
              </svg>
            </button>
          </div>
        </div>
      </header>
      <div id="workspace">
        <aside id="sidebar" aria-label="Files and outline" hidden></aside>
        <main id="panel">
        <div id="scroller" role="region" aria-label="Document" tabindex="0">
          <article id="doc" class="prose" hidden></article>
          <section id="notice" aria-live="polite">
            <svg class="notice-icon" aria-hidden="true" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
              <path d="M13 5.5h15.5L38 15v24a3.5 3.5 0 0 1-3.5 3.5h-21A3.5 3.5 0 0 1 10 39V9a3.5 3.5 0 0 1 3-3.5Z" />
              <path d="M28 5.5V15h10" />
              <path d="M17 24h14M17 31h9" />
            </svg>
            <p id="notice-title">Open a Markdown file to start reading.</p>
            <p id="notice-body" hidden></p>
            <button id="notice-open" class="button" type="button">Open file</button>
            <p id="notice-hints" class="chips">
              <span class="chip">Ctrl O to open</span>
              <span class="chip">Drop a file here</span>
            </p>
          </section>
        </div>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
