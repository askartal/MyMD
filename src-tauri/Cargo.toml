[package]
name = "mymd"
version = "0.1.0"
description = "A calm, read-only Markdown viewer for Windows 11"
authors = ["Ali Sinan Kartal"]
license = "MIT"
repository = "https://github.com/askartal/MyMD"
edition = "2024"
rust-version = "1.90"

[lib]
name = "mymd_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.5", features = ["protocol-asset"] }
